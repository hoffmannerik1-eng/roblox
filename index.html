<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>BlockWelt</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0d1a;--bg2:#141833;--sf:rgba(255,255,255,.07);--sf2:rgba(255,255,255,.12);--tx:#f2f4ff;--mu:#9aa2c8;--ac:#4f8cff;--ac2:#a35bff;--bd:rgba(255,255,255,.14);--g:linear-gradient(135deg,#4f8cff,#a35bff);color-scheme:dark}
:root[data-theme=light]{--bg:#eef1fb;--bg2:#dfe5fa;--sf:rgba(255,255,255,.8);--sf2:#fff;--tx:#161a33;--mu:#59608a;--bd:rgba(20,30,80,.15);color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#eef1fb;--bg2:#dfe5fa;--sf:rgba(255,255,255,.8);--sf2:#fff;--tx:#161a33;--mu:#59608a;--bd:rgba(20,30,80,.15);color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0,var(--bg2),transparent 55%),radial-gradient(circle at 90% 20%,rgba(163,91,255,.22),transparent 45%),var(--bg);background-attachment:fixed;min-height:100vh}
header{display:flex;gap:10px;align-items:center;padding:12px 20px;backdrop-filter:blur(16px);background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:9;flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;margin-right:auto;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.2s}
nav button:hover{color:var(--tx);background:var(--sf2)}nav button.on{background:var(--g);color:#fff;box-shadow:0 4px 18px rgba(99,102,255,.45)}
.me{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);padding:2px 12px 2px 6px;border-radius:999px;font-weight:600;font-size:14px}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.hero{border-radius:24px;padding:36px 30px;margin-bottom:26px;background:var(--g);position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(79,70,229,.35);color:#fff}
.hero h1{margin:0 0 6px;font-size:clamp(26px,5vw,42px);letter-spacing:-1px}.hero p{margin:0 0 18px;opacity:.9;max-width:480px}
.hero .bl{position:absolute;border-radius:14px;background:rgba(255,255,255,.14);animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(8deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s;backdrop-filter:blur(8px)}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 18px 40px rgba(0,0,0,.35);border-color:var(--ac)}
.th{height:130px;display:flex;align-items:center;justify-content:center;font-size:54px;color:#fff;background-size:cover;background-position:center;position:relative}
.th i{position:absolute;right:8px;top:8px;font:700 11px system-ui;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:99px;font-style:normal}
.in{padding:12px 14px}.in small{color:var(--mu)}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(99,102,255,.4);transition:.2s}
.btn:hover{transform:translateY(-2px)}.btn.w{background:#fff;color:#3b3bd6;box-shadow:none}
.sec{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;font:inherit;cursor:pointer}
input,textarea,select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;margin:4px 0 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(79,140,255,.25)}
textarea{min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:20px;backdrop-filter:blur(12px)}
.row{display:flex;gap:20px;flex-wrap:wrap}.row>*{flex:1;min-width:260px}
.stage{display:flex;justify-content:center;align-items:flex-end;min-height:300px;border-radius:16px;background:linear-gradient(#5aa9ff,#a7d8ff 70%,#58b368 70%);padding-bottom:8%}
.sw{display:inline-block;width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;margin:3px;box-shadow:0 0 0 1px var(--bd);transition:.15s}
.sw:hover{transform:scale(1.15)}.sw.on{border-color:var(--tx)}
iframe{width:100%;height:min(72vh,600px);border:0;background:#000;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mu{color:var(--mu)}label{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu)}
.drop{border:2px dashed var(--bd);border-radius:18px;padding:28px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:14px}
.drop.h,.drop:hover{border-color:var(--ac);background:rgba(79,140,255,.1)}
.file{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-bottom:6px;font-size:14px}
.file b{flex:1;overflow:hidden;text-overflow:ellipsis}.file small{color:var(--mu)}
.file button{border:0;background:none;color:var(--mu);cursor:pointer;font-size:16px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--sf2);margin-right:4px}
.err{color:#ff6b7a}.ok{color:#4fd68c}

.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.admin-stat{padding:18px;border:1px solid var(--bd);border-radius:16px;background:var(--sf)}
.admin-stat strong{display:block;font-size:28px;margin-top:5px}
.admin-user{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--bd)}
.admin-user:last-child{border:0}.admin-user .details{min-width:160px;flex:1}.admin-user .actions{display:flex;gap:7px;flex-wrap:wrap}
.admin-lock{max-width:430px;margin:50px auto;text-align:center}.admin-lock .lock-icon{font-size:48px;margin-bottom:10px}
.danger{background:linear-gradient(135deg,#ff526b,#b91c3c)!important;color:#fff!important}
</style></head><body>

const firebaseConfig={apiKey:"AIzaSyAz3-hfuJ-yAGPBKjnVkSWmtUJKHReSGp8",authDomain:"roblox2-fa121.firebaseapp.com",projectId:"roblox2-fa121",storageBucket:"roblox2-fa121.firebasestorage.app",messagingSenderId:"525999915088",appId:"1:525999915088:web:c6a2c6c2ae044a99ded155"};

async function init(){
 render();
 try{
  await auth.signInAnonymously();
  uid=auth.currentUser.uid;
  const profile=await db.doc(`users/${uid}`).get();
  if(profile.exists)av={...av,...profile.data()};
  if(!av.name||av.name==='Spieler'){
   const entered=prompt('Wie möchtest du in BlockWelt heißen?','Spieler');

   window.lastKickVersion=data.kickVersion||0;
  });
  db.doc(`users/${uid}`).onSnapshot(s=>{
   if(!s.exists)return;const d=s.data()||{};
   if(d.banned){const until=Number(d.banUntil||0);if(!until||until>Date.now()){alert('Dein BlockWelt-Konto wurde gesperrt.'+(d.banReason?' Grund: '+d.banReason:''));view='home';cur=null;render();}}
  });
 }catch(e){console.error('Firebase-Verbindung fehlgeschlagen:',e);alert('Firebase-Fehler: '+e.message);}
 try{const r=await fetch('games.json',{cache:'no-store'});if(r.ok){stat=await r.json();setG(dbg)}}catch(e){}
 render();
}
let dbg=[],stat=[],loc=[];function setG(a){dbg=a;games=dbg.concat(loc,stat.filter(s=>!dbg.some(d=>d.id==s.id)))}
async function exp(){const data=JSON.stringify(games.map((g,i)=>({...g,id:g.id||'s'+i})));try{const d=await claude.use('downloads');if(d){await d.save({filename:'games.json',data});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='games.json';a.click()}
function render(){
 $('#nav').innerHTML=[['home','Entdecken'],['avatar','Avatar'],['up','Spiel erstellen'],['admin','🔐 Admin']].map(([k,t])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${t}</button>`).join('');
 $('#me').innerHTML=svg(av,18)+`<span>${esc(av.name)}</span>`;
 const a=$('#app');
 if(view=='home'){const l=games.filter(g=>(g.title+g.cat+g.author).toLowerCase().includes(q.toLowerCase()));
  a.innerHTML=`<div class="hero"><span class="bl" style="width:70px;height:70px;right:60px;top:20px"></span><span class="bl" style="width:40px;height:40px;right:170px;bottom:24px;animation-delay:-3s"></span><span class="bl" style="width:90px;height:90px;right:-20px;bottom:-20px;animation-delay:-5s"></span><h1>Spiele. Bauen. Teilen.</h1><p>Erstelle deine eigenen Spiele, lade Skripte und Dateien hoch und veröffentliche sie für alle.</p><button class="btn w" onclick="go('up')">+ Spiel erstellen</button> <button class="btn w" onclick="exp()">⬇ games.json für GitHub</button></div>`+(db?'':'<p class="mu">Offline-Modus: Spiele werden nur lokal gespeichert.</p>')+`<input placeholder="🔍 Spiele suchen…" value="${esc(q)}" oninput="q=this.value;clearTimeout(window.t);window.t=setTimeout(()=>{render();$('#app input').focus();let i=$('#app input');i.setSelectionRange(99,99)},250)"><h2>Beliebte Spiele</h2>`+(l.length?`<div class="grid">${l.map(g=>`<div class="card" onclick="play('${g.id}')"><div class="th" style="background:${g.thumb?`url(${g.thumb}) center/cover`:col(g.title)}">${g.thumb?'':esc(g.icon||'🎮')}<i>${esc(g.cat||'Sonstiges')}</i></div><div class="in"><b>${esc(g.title)}</b><br><small>von ${esc(g.author)} · ▶ ${g.plays||0}</small></div></div>`).join('')}</div>`:`<div class="panel">Noch keine Spiele. Lade dein erstes hoch! 🚀</div>`)}
 else if(view=='play'){const g=games.find(x=>x.id==cur);a.innerHTML=g?`<button class="sec" onclick="go('home')">← Zurück</button><h2>${esc(g.icon)} ${esc(g.title)} <span class="tag">${esc(g.cat)}</span></h2><p class="mu">von ${esc(g.author)} — ${esc(g.desc)}</p><div class="panel" style="margin:12px 0"><b>⭐ Spiel bewerten</b><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><select id="voteSelect" style="max-width:150px;margin:0"><option value="0">Bewertung wählen</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${'★'.repeat(n)} (${n}/5)</option>`).join('')}</select><button class="sec" onclick="sendVote()">Bewerten</button><span id="voteInfo" class="mu">Bewertungen werden geladen…</span></div></div><iframe sandbox="allow-scripts allow-forms allow-pointer-lock allow-modals allow-popups allow-popups-to-escape-sandbox" allow="autoplay; fullscreen; gamepad" allowfullscreen id="fr"></iframe><br><br><button class="sec" onclick="$('#fr').requestFullscreen()">⛶ Vollbild</button><p class="mu" id="saveInfo">Spielstand wird automatisch in Firebase gespeichert, wenn das Spiel localStorage verwendet.</p>`:'Nicht gefunden';if(g)startGame(g)}
 else if(view=='admin'){
  if(!adminUnlocked){a.innerHTML=`<div class="panel admin-lock"><div class="lock-icon">🔐</div><h2>Admin-Zugang</h2><p class="mu">Gib dein Admin-Passwort ein, um die Verwaltung zu öffnen.</p><input id="adminPass" type="password" placeholder="Admin-Passwort" onkeydown="if(event.key==='Enter')unlockAdmin()"><button class="btn" onclick="unlockAdmin()">Entsperren</button><p id="adminError" class="err"></p></div>`;}
  else{a.innerHTML=`<div class="hero"><h1>🛡️ BlockWelt Admin</h1><p>Verwalte Spieler, Spiele und den Server.</p><button class="btn w" onclick="lockAdmin()">Abmelden</button></div><div class="admin-grid"><div class="admin-stat"><span class="mu">Spiele</span><strong>${games.length}</strong></div><div class="admin-stat"><span class="mu">Admin-Modus</span><strong style="color:#4fd68c">Aktiv</strong></div><div class="admin-stat"><span class="mu">Deine UID</span><small style="word-break:break-all">${esc(uid||'—')}</small></div></div><div class="panel"><h2>👥 Spieler verwalten</h2><p class="mu">Sperren gelten dauerhaft oder bis zum gewählten Zeitpunkt.</p><button class="sec" onclick="loadAdminPlayers()">Spielerliste aktualisieren</button><div id="adminPlayers" class="mu" style="margin-top:12px">Lade Spieler…</div></div><div class="panel" style="margin-top:16px"><h2>🎮 Spiele verwalten</h2><div id="adminGames">${games.map(g=>`<div class="admin-user"><div class="details"><b>${esc(g.title)}</b><br><small class="mu">${esc(g.author||'Unbekannt')}</small></div><div class="actions"><button class="sec danger" onclick="deleteGame('${g.id}')">Spiel löschen</button></div></div>`).join('')||'Keine Spiele vorhanden.'}</div></div><div class="panel" style="margin-top:16px"><h2>⚡ Server-Steuerung</h2><p class="mu">Meldet alle Spieler zurück zur Startseite. Es werden keine Konten gelöscht.</p><button class="btn danger" onclick="kickAllPlayers()">Alle Spieler aus Spielen werfen</button></div>`;loadAdminPlayers();}
 }

 ${[['skin','Haut'],['hair','Haare'],['shirt','Shirt'],['pants','Hose']].map(([k,t])=>`<label>${t}</label><div>${COLORS.map(c=>`<span class="sw ${av[k]==c?'on':''}" style="background:${c}" onclick="av.${k}='${c}';render()"></span>`).join('')}</div>`).join('')}

 <label>Gesicht</label><div>${FACES.map(f=>`<span class="sw ${av.face==f?'on':''}" style="background:var(--sf2);font-size:18px;text-align:center;line-height:26px;width:38px;height:38px" onclick="av.face='${f}';render()">${f}</span>`).join('')}</div><br><button class="btn" onclick="saveAv()">Speichern</button> <span id="ok" class="mu"></span></div></div>`;
 else drawUp()}
function drawUp(){const keep=['t','d','i','c'].map(k=>$('#'+k)?.value);
 $('#app').innerHTML=`<div class="panel"><h2 style="margin-top:0">🎮 Spiel erstellen</h2><div class="row"><div><label>Titel</label><input id="t" maxlength="40"><label>Beschreibung</label><input id="d" maxlength="120"></div><div><label>Icon (Emoji)</label><input id="i" value="🎮" maxlength="4"><label>Kategorie</label><select id="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
 <label>Dateien &amp; Skripte (.html .js .css .json .png .jpg .svg .mp3 …)</label>
 <div class="drop" id="dz" onclick="$('#fi').click()"><div style="font-size:34px">📁</div>Dateien hierher ziehen oder klicken<input type="file" id="fi" multiple hidden onchange="addF(this.files)"></div>
 ${files.map((f,i)=>`<div class="file">${f.t=='text'?'📄':'🖼️'}<b>${esc(f.name)}</b><small>${(f.size/1024).toFixed(1)} KB</small><button onclick="files.splice(${i},1);drawUp()">✕</button></div>`).join('')}
 <details style="margin:10px 0"><summary class="mu" style="cursor:pointer">➕ Skript direkt schreiben / einfügen</summary><input id="sn" placeholder="Dateiname z. B. game.js"><textarea id="sc" placeholder="Code hier einfügen…"></textarea><button class="sec" onclick="addS()">Skript hinzufügen</button></details>
 <label>Vorschaubild (optional)</label><input type="file" accept="image/*" onchange="setTh(this.files[0])">${thumb?`<div class="th" style="height:80px;width:140px;border-radius:12px;background:url(${thumb}) center/cover;margin-bottom:10px"></div>`:''}
 <button class="sec" onclick="prev()">👁 Vorschau</button> <button class="btn" onclick="upl()">🚀 Veröffentlichen</button> <span id="ok" class="${msg.startsWith('✓')?'ok':'err'}">${esc(msg)}</span>
 <p class="mu">Hauptdatei ist die <b>index.html</b> (oder die erste HTML-Datei). Verweise auf deine .js-, .css- und Bilddateien werden automatisch eingebunden. Ohne HTML-Datei erzeuge ich eine Seite aus deinen Skripten. Max. ca. 250 KB gesamt.</p><div id="pv"></div></div>`;
 [['t',0],['d',1],['i',2],['c',3]].forEach(([k,n])=>{if(keep[n]!=null)$('#'+k).value=keep[n]});
 const dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('h')};dz.ondragleave=()=>dz.classList.remove('h');dz.ondrop=e=>{e.preventDefault();addF(e.dataTransfer.files)}}
const rd=(f,u)=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);u?x.readAsDataURL(f):x.readAsText(f)});
async function addF(fl){for(const f of fl){const tx=/\.(html?|js|css|json|txt|svg|xml)$/i.test(f.name);files=files.filter(x=>x.name!=f.name);files.push({name:f.name,size:f.size,t:tx?'text':'bin',data:await rd(f,!tx)})}drawUp()}
function addS(){const n=$('#sn').value.trim(),c=$('#sc').value;if(!n||!c)return;files=files.filter(x=>x.name!=n);files.push({name:n,size:c.length,t:'text',data:c});drawUp()}
async function setTh(f){if(!f)return;const u=await rd(f,1);const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=320;c.height=180;c.getContext('2d').drawImage(im,0,0,320,180);thumb=c.toDataURL('image/jpeg',.7);drawUp()};im.src=u}
function bundle(){
 const by=n=>files.find(f=>f.name==n||f.name.split('/').pop()==n.split('/').pop());
 let h=files.find(f=>/^index\.html?$/i.test(f.name))||files.find(f=>/\.html?$/i.test(f.name));const used=new Set();let out;
 const sj=s=>s.replace(/<\/script/gi,'<\\/script');
 if(h){used.add(h.name);out=h.data;
  out=out.replace(/<script([^>]*?)\ssrc=["']([^"']+)["']([^>]*)><\/script>/gi,(m,a,s,b)=>{const f=by(s);if(!f||f.t!='text')return m;used.add(f.name);return `<script${a}${b}>${sj(f.data)}<\/script>`});
  out=out.replace(/<link([^>]*?)href=["']([^"']+\.css)["']([^>]*)>/gi,(m,a,s)=>{const f=by(s);if(!f)return m;used.add(f.name);return `<style>${f.data}</style>`})}
 else{const cs=files.filter(f=>/\.css$/i.test(f.name)),js=files.filter(f=>/\.js$/i.test(f.name));cs.concat(js).forEach(f=>used.add(f.name));
  out=`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#111;color:#fff;font-family:sans-serif}${cs.map(f=>f.data).join('\n')}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.admin-stat{padding:18px;border:1px solid var(--bd);border-radius:16px;background:var(--sf)}

.admin-user:last-child{border:0}.admin-user .details{min-width:160px;flex:1}.admin-user .actions{display:flex;gap:7px;flex-wrap:wrap}

</style></head><body><canvas id="game" style="display:block;width:100%;height:100vh"></canvas>${js.map(f=>`<script>${sj(f.data)}<\/script>`).join('')}</body></html>`}
 files.filter(f=>!used.has(f.name)).forEach(f=>{const uri=f.t=='bin'?f.data:'data:text/plain;charset=utf-8,'+encodeURIComponent(f.data);const nm=f.name.split('/').pop();out=out.split('./'+nm).join(uri).split(nm).join(uri)});
 return out}
function prev(){if(!files.length){msg='Füge erst Dateien oder Skripte hinzu';return drawUp()}$('#pv').innerHTML='<br><iframe sandbox="allow-scripts" id="pf"></iframe>';$('#pf').srcdoc=bundle()}
async function saveAv(){try{if(!uid)throw new Error('Noch nicht mit Firebase verbunden');await db.doc(`users/${uid}`).set(av,{merge:true});$('#ok').textContent='Gespeichert ✓'}catch(e){$('#ok').textContent='Fehler: '+e.message}}
let saveTimer=null;
function gameBridge(html,initialData={}){
 const initial=JSON.stringify(initialData).replace(/</g,'\\u003c');
 const bridge=`<script>(function(){const data=${initial};let ready=true;const store={get length(){return Object.keys(data).length},key(i){return Object.keys(data)[i]??null},getItem(k){k=String(k);return Object.prototype.hasOwnProperty.call(data,k)?String(data[k]):null},setItem(k,v){data[String(k)]=String(v);send()},removeItem(k){delete data[String(k)];send()},clear(){Object.keys(data).forEach(k=>delete data[k]);send()}};let timer=null;function send(){clearTimeout(timer);timer=setTimeout(()=>{try{parent.postMessage({type:'BW_SAVE',data:{...data}},'*')}catch(e){}},150)};try{Object.defineProperty(window,'localStorage',{configurable:true,value:store});}catch(e){window.localStorage=store;}window.BlockWeltSave={save:(k,v)=>store.setItem(k,typeof v==='string'?v:JSON.stringify(v)),load:(k,fallback)=>{const v=store.getItem(k);if(v===null)return fallback;try{return JSON.parse(v)}catch(e){return v}},ready:fn=>fn()};parent.postMessage({type:'BW_READY'},'*');})();<\/script>`;
 return /<\/head>/i.test(html)?html.replace(/<\/head>/i,bridge+'</head>'):bridge+html;
}
async function startGame(g){
 const frame=$('#fr');let initial={};
 try{if(uid){const snap=await db.doc(`users/${uid}/saves/${g.id}`).get();if(snap.exists)initial=snap.data().data||{};}}catch(e){console.error('Spielstand laden:',e)}
 if(!$('#fr')||cur!==g.id)return;
 frame.srcdoc=gameBridge(g.html||'',initial);
 const el=$('#saveInfo');if(el)el.textContent=Object.keys(initial).length?'Letzter Spielstand geladen. Neue Fortschritte werden automatisch gespeichert.':'Neues Spiel: Fortschritte werden automatisch gespeichert.';
 loadVoteInfo(g.id);
}
window.addEventListener('message',e=>{
 const frame=$('#fr');if(!frame||e.source!==frame.contentWindow||!e.data)return;
 if(e.data.type==='BW_SAVE'&&uid&&cur){clearTimeout(saveTimer);const data=e.data.data||{};saveTimer=setTimeout(async()=>{try{const json=JSON.stringify(data);if(json.length>700000)throw new Error('Spielstand ist zu groß (max. ca. 700 KB)');await db.doc(`users/${uid}/saves/${cur}`).set({data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});const el=$('#saveInfo');if(el)el.textContent='Spielstand automatisch gespeichert ✓';}catch(err){console.error('Spielstand speichern:',err);const el=$('#saveInfo');if(el)el.textContent='Speicherfehler: '+err.message;}},700);}
});
async function loadVoteInfo(id){try{const s=await db.collection(`games/${id}/votes`).get();const vals=s.docs.map(d=>d.data().value).filter(n=>Number.isInteger(n)&&n>=1&&n<=5);const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'–';const el=$('#voteInfo');if(el)el.textContent=`${avg} / 5 · ${vals.length} Bewertungen`;if(uid){const mine=await db.doc(`games/${id}/votes/${uid}`).get();if(mine.exists&&$('#voteSelect'))$('#voteSelect').value=mine.data().value;}}catch(e){const el=$('#voteInfo');if(el)el.textContent='Bewertungen nicht verfügbar';}}
async function sendVote(){const n=Number($('#voteSelect')?.value||0);if(!uid||!cur){alert('Bitte kurz warten, bis Firebase verbunden ist.');return}if(n<1||n>5){alert('Bitte zuerst 1 bis 5 Sterne wählen.');return}try{await db.doc(`games/${cur}/votes/${uid}`).set({value:n,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});loadVoteInfo(cur); }catch(e){alert('Bewertung fehlgeschlagen: '+e.message)}}
async function upl(){if(!adminUnlocked){alert('Nur Admins dürfen Spiele veröffentlichen.');view='admin';render();return}const t=$('#t').value.trim();if(!t||!files.length){msg='Titel und mindestens eine Datei nötig';return drawUp()}
 const html=bundle();if(html.length>250000){msg='Zu groß ('+Math.round(html.length/1024)+' KB). Max. 250 KB – Bilder verkleinern.';return drawUp()}
 const g={title:t,desc:$('#d').value.trim(),icon:$('#i').value||'🎮',cat:$('#c').value,html,thumb,author:av.name,ownerUid:uid,created:Date.now(),plays:0};
 try{if(!uid)throw new Error('Noch nicht mit Firebase verbunden. Bitte Seite neu laden.');await db.collection('games').add(g);files=[];thumb='';msg='';view='home';render()}catch(e){msg='Firebase-Upload fehlgeschlagen: '+(e.message||'');drawUp()}}
function go(v){if(v==='up'&&!adminUnlocked){view='admin';render();return}view=v;render()}
function unlockAdmin(){const v=$('#adminPass')?.value||'';if(v===ADMIN_PASSWORD){adminUnlocked=true;sessionStorage.setItem('bw_admin_ok','1');render()}else{$('#adminError').textContent='Falsches Passwort.';}}
function lockAdmin(){adminUnlocked=false;sessionStorage.removeItem('bw_admin_ok');view='home';render()}
async function loadAdminPlayers(){if(!adminUnlocked)return;const el=$('#adminPlayers');if(!el)return;el.textContent='Lade Spieler…';try{const snap=await db.collection('users').get();if(!snap.size){el.textContent='Noch keine Spieler gefunden.';return;}el.innerHTML=snap.docs.map(doc=>{const d=doc.data()||{},name=esc(d.name||'Unbenannt'),banned=!!d.banned,until=Number(d.banUntil||0);const status=banned?(!until?'Dauerhaft gesperrt':until>Date.now()?'Gesperrt bis '+new Date(until).toLocaleString('de-DE'):'Sperre abgelaufen'):'Aktiv';return `<div class="admin-user"><div class="details"><b>${name}</b><br><small class="mu">${esc(doc.id)}</small><br><small class="${banned?'err':'ok'}">${status}</small></div><div class="actions"><select id="ban-${doc.id}" style="width:125px;margin:0"><option value="3600000">1 Stunde</option><option value="86400000">24 Stunden</option><option value="604800000">7 Tage</option><option value="2592000000">30 Tage</option><option value="0">Dauerhaft</option></select><button class="sec danger" onclick="banUser('${doc.id}')">Sperren</button>${banned?`<button class="sec" onclick="unbanUser('${doc.id}')">Entsperren</button>`:''}</div></div>`}).join('');}catch(e){el.textContent='Fehler beim Laden: '+e.message;}}
async function banUser(id){if(!adminUnlocked)return;const duration=Number($('#ban-'+id)?.value||0);const reason=prompt('Sperrgrund (optional):','Regelverstoß')||'';try{await db.doc(`users/${id}`).set({banned:true,banUntil:duration?Date.now()+duration:0,banReason:reason},{merge:true});loadAdminPlayers();}catch(e){alert('Sperren fehlgeschlagen: '+e.message)}}
async function unbanUser(id){if(!adminUnlocked)return;try{await db.doc(`users/${id}`).set({banned:false,banUntil:0,banReason:''},{merge:true});loadAdminPlayers();}catch(e){alert('Entsperren fehlgeschlagen: '+e.message)}}
async function kickAllPlayers(){if(!adminUnlocked||!confirm('Wirklich alle Spieler aus ihren Spielen werfen?'))return;try{const ref=db.doc('system/control');const snap=await ref.get();const v=(snap.exists?snap.data().kickVersion||0:0)+1;await ref.set({kickVersion:v,kickAt:Date.now()},{merge:true});alert('Befehl wurde gesendet.');}catch(e){alert('Fehler: '+e.message)}}
async function deleteGame(id){if(!adminUnlocked||!confirm('Dieses Spiel wirklich löschen?'))return;try{await db.doc(`games/${id}`).delete();alert('Spiel gelöscht.');render();}catch(e){alert('Löschen fehlgeschlagen: '+e.message)}}
init();
