<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlockWelt</title>
<style>
:root{--bg:#080d1d;--panel:#111d36;--panel2:#172747;--text:#eef4ff;--muted:#9aacca;--line:#263b61;--blue:#3478ff;--purple:#895cff;--grad:linear-gradient(120deg,#3478ff,#895cff)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.45 system-ui,Arial;background:radial-gradient(ellipse at 12% 0,rgba(52,120,255,.22),transparent 42%),radial-gradient(ellipse at 95% 15%,rgba(137,92,255,.18),transparent 38%),var(--bg)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:rgba(8,14,30,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.logo{font-size:23px;font-weight:900;margin-right:auto;background:linear-gradient(90deg,#76b7ff,#a78bfa,#5ee7ff);background-clip:text;color:transparent}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:9px 13px;border-radius:30px;cursor:pointer}
nav button.on,nav button:hover{background:var(--grad);color:white}
.pill{border:1px solid #235b45;background:#103326;color:#8bf0b5;border-radius:30px;padding:6px 10px;font-size:12px}
.me{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);padding:3px 10px;border-radius:30px;font-size:13px}
main{max-width:1200px;margin:auto;padding:24px 16px 60px}
.hero{position:relative;overflow:hidden;border-radius:25px;padding:clamp(28px,5vw,52px);background:linear-gradient(115deg,#1646a5,#315fe0 50%,#7446cf);box-shadow:0 18px 48px #1b3d8a55;margin-bottom:25px}
.hero:after{content:'🎮';position:absolute;right:7%;top:20%;font-size:clamp(70px,13vw,145px);opacity:.2}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.05;margin:0 0 12px;max-width:700px}
.hero p{max-width:540px;color:#e2eaff;margin:0 0 20px}
.btn,.sec,.danger{font:inherit;font-weight:700;border-radius:11px;padding:10px 15px;cursor:pointer}
.btn{background:var(--grad);color:white;border:0;box-shadow:0 6px 18px #3478ff44}
.btn.white{background:white;color:#245cc2}
.sec{background:#172744;color:var(--text);border:1px solid var(--line)}
.danger{background:#4b1d2a;color:#ffb5c1;border:1px solid #713044}
input,textarea,select{width:100%;margin:5px 0 12px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#101b31;color:var(--text);font:inherit}
textarea{min-height:180px;font:13px monospace}
label{display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.panel{background:linear-gradient(145deg,#14223f,#0e192e);border:1px solid var(--line);border-radius:18px;padding:19px}
.home-tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.home-tools input{flex:1;min-width:220px;margin:0}
.section{margin:30px 0}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:13px}
.section-head h2{margin:0;font-size:23px}
.section-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.game-card{overflow:hidden;position:relative;background:linear-gradient(145deg,#142442,#0e192e);border:1px solid var(--line);border-radius:17px;cursor:pointer;transition:.2s}
.game-card:hover{transform:translateY(-4px);border-color:#6597ff;box-shadow:0 16px 32px #0005}
.art{height:140px;display:flex;align-items:center;justify-content:center;position:relative;background-size:cover;background-position:center;font-size:60px}
.cat{position:absolute;top:10px;left:10px;background:#071126c9;color:white;padding:4px 8px;border-radius:30px;font-size:11px}
.fav{position:absolute;right:10px;top:10px;border:1px solid #ffffff55;border-radius:50%;width:35px;height:35px;background:#071126cc;color:white;font-size:20px;cursor:pointer}
.fav.active{color:#ff6b9b}
.info{padding:12px 14px}
.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small,.stats{color:var(--muted);font-size:12px}
.stats{display:flex;gap:12px;margin-top:7px}
.empty{padding:22px;border:1px dashed #365078;border-radius:15px;text-align:center;color:var(--muted)}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row>*{flex:1;min-width:250px}
.stage{min-height:280px;border-radius:14px;background:linear-gradient(#63aaff,#c3e1ff 70%,#54ad64 70%);display:flex;align-items:end;justify-content:center;padding-bottom:20px}
.sw{display:inline-flex;width:30px;height:30px;border-radius:50%;margin:4px;border:2px solid #789;cursor:pointer}
.sw.on{outline:2px solid white}
.drop{padding:25px;border:2px dashed #45618b;border-radius:15px;text-align:center;cursor:pointer;margin:10px 0}
.file{display:flex;gap:10px;align-items:center;padding:8px 10px;margin:5px 0;background:#101c32;border:1px solid var(--line);border-radius:10px}
.file b{flex:1;overflow:hidden;text-overflow:ellipsis}
.admin-login{max-width:430px;margin:7vh auto;padding:25px;background:#142442;border:1px solid var(--line);border-radius:20px}
.admin-item{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin:8px 0}
.admin-item .grow{flex:1}
.admin-item small{display:block;color:var(--muted)}
iframe{width:100%;height:min(72vh,650px);border:0;border-radius:14px;background:#000}
.muted{color:var(--muted)}
.ok{color:#75e4a6}
.err{color:#ff8998}
@media(max-width:620px){
 header{padding:10px}
 .pill{padding:5px 7px}
 main{padding:15px 11px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .art{height:110px;font-size:46px}
 .info{padding:9px}
 .info b{font-size:13px}
 .hero{padding:26px}
 .hero:after{right:2%;top:12%;font-size:75px}
}
</style>
</head>
<body>

<header>
 <span class="logo">🧱 BlockWelt</span>
 <nav id="nav"></nav>
 <span class="pill" id="online">● 0 online</span>
 <span class="me" id="me">Spieler</span>
</header>

<main id="app">
 <div class="panel">BlockWelt wird geladen …</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
'use strict';

/* FIREBASE */
const firebaseConfig={
 apiKey:'AIzaSyAz3-hfuJ-yAGPBKjnVkSWmtUJKHReSGp8',
 authDomain:'roblox2-fa121.firebaseapp.com',
 projectId:'roblox2-fa121',
 storageBucket:'roblox2-fa121.firebasestorage.app',
 messagingSenderId:'525999915088',
 appId:'1:525999915088:web:c6a2c6c2ae044a99ded155'
};

if(!window.firebase){
 document.getElementById('app').textContent='Firebase konnte nicht geladen werden. Prüfe deine Internetverbindung.';
 throw new Error('Firebase SDK fehlt');
}

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

/* EINSTELLUNGEN */
const ADMIN_PASSWORD='BW-Admin-7391';
const COLORS=['#f2c9a0','#d9a273','#8d5a3b','#ffe0bd','#4caf50','#4f8cff','#e53935','#ffb300','#a35bff','#222','#fff','#00acc1'];
const HATS=['keiner','Mütze','Krone','Zylinder'];
const FACES=['😀','😎','😛','🤖','😈'];
const CATS=['Abenteuer','Action','Puzzle','Rennen','Sonstiges'];

let av={
 name:'Spieler',skin:'#f2c9a0',hair:'#3a2a1a',
 shirt:'#4f8cff',pants:'#222',hat:'keiner',face:'😀'
};

let games=[];
let uid=null;
let view='home';
let cur=null;
let q='';
let files=[];
let thumb='';
let msg='';
let adminUnlocked=false;
let onlineTimer=null;
let saveTimer=null;
let firebaseState='Verbinde mit Firebase …';

const $=s=>document.querySelector(s);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function avatarSvg(a=av,size=24){
 return `<svg width="${size}" height="${size*1.4}" viewBox="0 -16 100 156">
 <rect x="30" y="85" width="18" height="45" rx="3" fill="${a.pants}"/>
 <rect x="52" y="85" width="18" height="45" rx="3" fill="${a.pants}"/>
 <rect x="28" y="45" width="44" height="45" rx="6" fill="${a.shirt}"/>
 <rect x="14" y="45" width="14" height="38" rx="5" fill="${a.skin}"/>
 <rect x="72" y="45" width="14" height="38" rx="5" fill="${a.skin}"/>
 <rect x="28" y="5" width="44" height="42" rx="10" fill="${a.skin}"/>
 <rect x="28" y="5" width="44" height="10" rx="5" fill="${a.hair}"/>
 <text x="50" y="40" font-size="26" text-anchor="middle">${a.face}</text>
 </svg>`;
}

function gradient(s){
 let h=0;
 for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;
 return `linear-gradient(135deg,hsl(${h} 70% 48%),hsl(${(h+50)%360} 70% 35%))`;
}

/* FAVORITEN */
function getFavs(){
 try{return JSON.parse(localStorage.getItem('bw_favs')||'[]').map(String)}
 catch{return []}
}

function toggleFav(id){
 let a=new Set(getFavs()),k=String(id);
 a.has(k)?a.delete(k):a.add(k);
 localStorage.setItem('bw_favs',JSON.stringify([...a]));
 if(view==='home')render();
}

/* SPIELKARTEN */
function card(g){
 let fav=getFavs().includes(String(g.id));
 let art=g.thumb
  ?`background-image:url('${String(g.thumb).replace(/'/g,'%27')}')`
  :`background:${gradient(g.title)}`;

 return `<article class="game-card" onclick="play('${esc(g.id)}')">
 <div class="art" style="${art}">
 ${g.thumb?'':esc(g.icon||'🎮')}
 <span class="cat">${esc(g.cat||'Sonstiges')}</span>
 <button class="fav ${fav?'active':''}" onclick="event.stopPropagation();toggleFav('${esc(g.id)}')">${fav?'♥':'♡'}</button>
 </div>
 <div class="info">
 <b>${esc(g.title||'Spiel')}</b>
 <small>von ${esc(g.author||'Unbekannt')}</small>
 <div class="stats">
 <span>▶ ${Number(g.plays||0).toLocaleString('de-DE')}</span>
 <span>${esc(g.cat||'Game')}</span>
 </div>
 </div>
 </article>`;
}

function section(title,sub,list,empty){
 return `<section class="section">
 <div class="section-head">
 <div><h2>${title}</h2><p>${sub}</p></div>
 <span class="muted">${list.length} Spiele</span>
 </div>
 ${list.length
  ?`<div class="cards">${list.map(card).join('')}</div>`
  :`<div class="empty">${empty}</div>`}
 </section>`;
}

/* SEITEN */
function render(){
 const nav=[
  ['home','Entdecken'],
  ['avatar','Avatar'],
  ['up','Spiel erstellen'],
  ['admin','Admin']
 ];

 $('#nav').innerHTML=nav.map(([k,t])=>
  `<button class="${view===k?'on':''}" onclick="go('${k}')">${t}</button>`
 ).join('');

 $('#me').innerHTML=avatarSvg(av,20)+` ${esc(av.name)}`;

 let a=$('#app');

 if(view==='home'){
  let s=q.toLowerCase();

  let all=games.filter(g=>
   `${g.title||''} ${g.cat||''} ${g.author||''}`.toLowerCase().includes(s)
  );

  let fav=all.filter(g=>getFavs().includes(String(g.id)));
  let newest=[...all].sort((x,y)=>(y.created||0)-(x.created||0));
  let popular=[...all].sort((x,y)=>(y.plays||0)-(x.plays||0));

  a.innerHTML=`
  <div class="muted" style="font-size:12px;margin-bottom:9px">${esc(firebaseState)}</div>

  <section class="hero">
   <h1>Deine nächste Spielwelt wartet.</h1>
   <p>Entdecke Community-Games, sammle Favoriten und veröffentliche deine eigenen Spiele.</p>
   <button class="btn white" onclick="go('up')">＋ Spiel erstellen</button>
  </section>

  <div class="home-tools">
   <input id="search" placeholder="🔎 Spiele suchen …" value="${esc(q)}"
    oninput="q=this.value;clearTimeout(window.searchTimer);window.searchTimer=setTimeout(()=>{
     let p=this.selectionStart;render();let n=$('#search');n.focus();n.setSelectionRange(p,p)
    },160)">
   <button class="sec" onclick="q='';render()">Zurücksetzen</button>
  </div>

  ${section('♥ Deine Favoriten','Deine gespeicherten Lieblingsspiele',fav,'Tippe bei einem Spiel auf das Herz, um es zu speichern.')}

  ${section('✨ Neueste Spiele','Frisch veröffentlichte Spiele',newest.slice(0,8),'Noch keine Spiele veröffentlicht.')}

  ${section('🔥 Meistgespielt','Die beliebtesten Spiele nach Aufrufen',popular.slice(0,8),'Noch keine Aufrufe vorhanden.')}

  ${all.length>8?section('🎮 Alle Spiele','Die gesamte BlockWelt-Bibliothek',all,'Keine Spiele gefunden.'):''}

  ${all.length===0&&games.length?'<div class="empty">Keine Treffer.</div>':''}
  `;
 }

 else if(view==='play'){
  let g=games.find(x=>String(x.id)===String(cur));

  a.innerHTML=g?`
   <button class="sec" onclick="go('home')">← Zurück</button>
   <h2>${esc(g.icon||'🎮')} ${esc(g.title)}</h2>
   <p class="muted">von ${esc(g.author||'Unbekannt')} · ${esc(g.desc||'')}</p>

   <div class="panel" style="margin:12px 0">
    <b>⭐ Spiel bewerten</b>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
     <select id="vote" style="max-width:150px">
      <option value="0">Bewertung</option>
      ${[1,2,3,4,5].map(n=>`<option value="${n}">${'★'.repeat(n)} (${n}/5)</option>`).join('')}
     </select>
     <button class="sec" onclick="sendVote()">Bewerten</button>
     <span id="voteInfo" class="muted">Lade Bewertungen …</span>
    </div>
   </div>

   <iframe id="fr" title="${esc(g.title)}"
    sandbox="allow-scripts allow-forms allow-pointer-lock allow-modals allow-popups allow-popups-to-escape-sandbox"
    allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>

   <p id="saveInfo" class="muted">Spielstand wird geladen …</p>
  `:'<div class="empty">Spiel nicht gefunden.</div>';

  if(g)startGame(g);
 }

 else if(view==='avatar'){
  a.innerHTML=`
  <div class="row">
   <div class="panel"><div class="stage">${avatarSvg(av,170)}</div></div>
   <div class="panel">
    <label>Name</label>
    <input id="avname" maxlength="20" value="${esc(av.name)}">

    <label>Hautfarbe</label>
    <div>${COLORS.map(c=>`<span class="sw ${av.skin===c?'on':''}" style="background:${c}" onclick="av.skin='${c}';render()"></span>`).join('')}</div>

    <label>Haarfarbe</label>
    <div>${COLORS.map(c=>`<span class="sw ${av.hair===c?'on':''}" style="background:${c}" onclick="av.hair='${c}';render()"></span>`).join('')}</div>

    <label>Shirt</label>
    <div>${COLORS.map(c=>`<span class="sw ${av.shirt===c?'on':''}" style="background:${c}" onclick="av.shirt='${c}';render()"></span>`).join('')}</div>

    <label>Hose</label>
    <div>${COLORS.map(c=>`<span class="sw ${av.pants===c?'on':''}" style="background:${c}" onclick="av.pants='${c}';render()"></span>`).join('')}</div>

    <label>Hut</label>
    <select id="hat">${HATS.map(h=>`<option ${av.hat===h?'selected':''}>${h}</option>`).join('')}</select>

    <label>Gesicht</label>
    <div>${FACES.map(f=>`<button class="sec" onclick="av.face='${f}';render()">${f}</button>`).join(' ')}</div>

    <br>
    <button class="btn" onclick="saveAvatar()">Avatar speichern</button>
    <span id="avmsg" class="muted"></span>
   </div>
  </div>`;

  $('#avname').oninput=e=>av.name=e.target.value;
  $('#hat').onchange=e=>av.hat=e.target.value;
 }

 else if(view==='admin'){
  a.innerHTML=adminView();
 }

 else{
  drawUpload();
 }
}

/* ADMIN */
function adminView(){
 if(!adminUnlocked){
  return `<div class="admin-login">
   <div style="font-size:36px">🛡️</div>
   <h2>Admin-Bereich</h2>
   <p class="muted">Nur das Admin-Passwort eingeben.</p>
   <label>Passwort</label>
   <input id="adminPass" type="password" placeholder="Admin-Passwort"
    onkeydown="if(event.key==='Enter')adminLogin()">
   <button class="btn" style="width:100%" onclick="adminLogin()">Admin öffnen</button>
   <p id="adminMsg" class="err"></p>
  </div>`;
 }

 return `<div class="panel">
  <h2>🛡️ Spiele verwalten</h2>
  <button class="sec" onclick="adminUnlocked=false;go('home')">Abmelden</button>
  <p class="muted">${games.length} Spiele</p>
  ${games.map(g=>`
   <div class="admin-item">
    <span>${esc(g.icon||'🎮')}</span>
    <div class="grow">
     <b>${esc(g.title)}</b>
     <small>${esc(g.author||'Unbekannt')}</small>
    </div>
    <button class="danger" onclick="deleteGame('${esc(g.id)}')">Löschen</button>
   </div>
  `).join('')}
 </div>`;
}

function adminLogin(){
 if($('#adminPass').value===ADMIN_PASSWORD){
  adminUnlocked=true;
  render();
 }else{
  $('#adminMsg').textContent='Falsches Passwort.';
 }
}

async function deleteGame(id){
 let g=games.find(x=>x.id===id);
 if(!g||!confirm(`Spiel „${g.title}“ löschen?`))return;

 try{
  await db.collection('games').doc(id).delete();
 }catch(e){
  alert('Firebase hat das Löschen blockiert: '+e.message);
 }
}

function go(v){
 view=v;
 render();
}

/* BESUCHERZÄHLER */
function updateOnline(n){
 $('#online').textContent='● '+n+' online';
}

function startPresence(){
 if(!uid)return;

 let ref=db.collection('presence').doc(uid);
 let beat=()=>ref.set({lastSeen:Date.now()},{merge:true}).catch(()=>{});

 beat();
 onlineTimer=setInterval(beat,30000);

 db.collection('presence').onSnapshot(s=>{
  let cut=Date.now()-120000;
  updateOnline(s.docs.filter(d=>(d.data().lastSeen||0)>cut).length);
 },()=>updateOnline(0));
}

/* AVATAR SPEICHERN */
async function saveAvatar(){
 try{
  av.name=$('#avname').value.trim()||'Spieler';
  av.hat=$('#hat').value;

  if(!uid)throw Error('Firebase noch nicht verbunden');

  await db.doc('users/'+uid).set(av,{merge:true});
  $('#avmsg').textContent=' Gespeichert ✓';
 }catch(e){
  $('#avmsg').textContent=' '+e.message;
 }
}

/* SPIEL-UPLOAD */
function drawUpload(){
 let keep=['title','desc','icon','cat'].map(id=>$('#'+id)?.value);

 $('#app').innerHTML=`
 <div class="panel">
  <h2>🎮 Spiel veröffentlichen</h2>

  <div class="row">
   <div>
    <label>Titel</label><input id="title" maxlength="40">
    <label>Beschreibung</label><input id="desc" maxlength="120">
   </div>
   <div>
    <label>Icon</label><input id="icon" value="🎮" maxlength="4">
    <label>Kategorie</label>
    <select id="cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
   </div>
  </div>

  <label>Spiel-Dateien</label>
  <div class="drop" onclick="$('#fileInput').click()">
   📁 Dateien auswählen oder hier ablegen
   <input id="fileInput" type="file" multiple hidden onchange="addFiles(this.files)">
  </div>

  ${files.map((f,i)=>`
   <div class="file">
    <b>${esc(f.name)}</b>
    <small>${Math.round(f.size/1024)} KB</small>
    <button class="sec" onclick="files.splice(${i},1);drawUpload()">Entfernen</button>
   </div>
  `).join('')}

  <label>Vorschaubild (optional)</label>
  <input type="file" accept="image/*" onchange="setThumbnail(this.files[0])">

  <button class="btn" onclick="uploadGame()">🚀 Veröffentlichen</button>
  <span id="uploadMsg" class="muted">${esc(msg)}</span>

  <p class="muted">Lade eine index.html und bei Bedarf JS-, CSS- und Bilddateien hoch. Maximal 250 KB.</p>
 </div>`;

 ['title','desc','icon','cat'].forEach((id,i)=>{
  if(keep[i]!=null)$('#'+id).value=keep[i];
 });

 let d=document.querySelector('.drop');

 d.ondragover=e=>{
  e.preventDefault();
  d.style.borderColor='#69a0ff';
 };

 d.ondrop=e=>{
  e.preventDefault();
  addFiles(e.dataTransfer.files);
 };
}

const readFile=(f,data)=>new Promise((res,rej)=>{
 let r=new FileReader();
 r.onload=()=>res(r.result);
 r.onerror=rej;
 data?r.readAsDataURL(f):r.readAsText(f);
});

async function addFiles(list){
 for(let f of list){
  let text=/\.(html?|js|css|json|txt|svg|xml)$/i.test(f.name);
  files=files.filter(x=>x.name!==f.name);
  files.push({
   name:f.name,
   size:f.size,
   text,
   data:await readFile(f,!text)
  });
 }
 drawUpload();
}

async function setThumbnail(f){
 if(!f)return;
 thumb=await readFile(f,true);
 drawUpload();
}

function bundleGame(){
 let by=n=>files.find(f=>
  f.name===n||f.name.split('/').pop()===n.split('/').pop()
 );

 let html=files.find(f=>/^index\.html?$/i.test(f.name))
  ||files.find(f=>/\.html?$/i.test(f.name));

 let used=new Set(),out='';
 let safe=s=>s.replace(/<\/script/gi,'<\\/script');

 if(html){
  used.add(html.name);
  out=html.data;

  out=out.replace(
   /<script([^>]*?)\ssrc=["']([^"']+)["']([^>]*)><\/script>/gi,
   (m,a,n,b)=>{
    let f=by(n);
    if(!f||!f.text)return m;
    used.add(f.name);
    return `<script${a}${b}>${safe(f.data)}<\/script>`;
   }
  );

  out=out.replace(
   /<link([^>]*?)href=["']([^"']+\.css)["']([^>]*)>/gi,
   (m,a,n)=>{
    let f=by(n);
    if(!f)return m;
    used.add(f.name);
    return `<style>${f.data}</style>`;
   }
  );
 }else{
  let css=files.filter(f=>/\.css$/i.test(f.name));
  let js=files.filter(f=>/\.js$/i.test(f.name));

  css.concat(js).forEach(f=>used.add(f.name));

  out=`<!doctype html>
  <html><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>body{margin:0;background:#111;color:white}${css.map(f=>f.data).join('\n')}</style>
  </head><body>
  <canvas id="game" style="width:100%;height:100vh"></canvas>
  ${js.map(f=>`<script>${safe(f.data)}<\/script>`).join('')}
  </body></html>`;
 }

 files.filter(f=>!used.has(f.name)).forEach(f=>{
  let uri=f.text
   ?'data:text/plain;charset=utf-8,'+encodeURIComponent(f.data)
   :f.data;

  let n=f.name.split('/').pop();
  out=out.split('./'+n).join(uri).split(n).join(uri);
 });

 return out;
}

async function uploadGame(){
 let title=$('#title').value.trim();

 if(!title||!files.length){
  $('#uploadMsg').textContent='Titel und mindestens eine Datei sind nötig.';
  return;
 }

 if(!uid){
  $('#uploadMsg').textContent='Firebase-Anmeldung läuft noch. Bitte kurz warten.';
  return;
 }

 let html=bundleGame();

 if(html.length>250000){
  $('#uploadMsg').textContent='Spiel ist zu groß (max. 250 KB).';
  return;
 }

 let g={
  title,
  desc:$('#desc').value.trim(),
  icon:$('#icon').value||'🎮',
  cat:$('#cat').value,
  html,
  thumb,
  author:av.name,
  ownerUid:uid,
  created:Date.now(),
  plays:0
 };

 try{
  await db.collection('games').add(g);
  files=[];
  thumb='';
  msg='';
  go('home');
 }catch(e){
  $('#uploadMsg').textContent='Upload fehlgeschlagen: '+e.message;
 }
}

/* SPIELSTÄNDE */
function bridgeGame(html,data){
 let json=JSON.stringify(data||{}).replace(/</g,'\\u003c');

 let bridge=`<script>
 (function(){
  const d=${json};
  let t;

  function send(){
   clearTimeout(t);
   t=setTimeout(()=>{
    parent.postMessage({type:'BW_SAVE',data:{...d}},'*');
   },200);
  }

  const s={
   get length(){return Object.keys(d).length},
   key(i){return Object.keys(d)[i]||null},
   getItem(k){
    return Object.prototype.hasOwnProperty.call(d,k)?String(d[k]):null;
   },
   setItem(k,v){d[k]=String(v);send()},
   removeItem(k){delete d[k];send()},
   clear(){
    Object.keys(d).forEach(k=>delete d[k]);
    send();
   }
  };

  try{
   Object.defineProperty(window,'localStorage',{
    configurable:true,
    value:s
   });
  }catch(e){}

  window.BlockWeltSave={
   save:(k,v)=>s.setItem(k,typeof v==='string'?v:JSON.stringify(v)),
   load:(k,f)=>{
    let v=s.getItem(k);
    if(v===null)return f;
    try{return JSON.parse(v)}catch(e){return v}
   }
  };
 })();
 <\/script>`;

 return /<head[^>]*>/i.test(html)
  ?html.replace(/<head[^>]*>/i,m=>m+bridge)
  :bridge+html;
}

async function startGame(g){
 let frame=$('#fr');
 let data={};

 try{
  if(uid){
   let s=await db.doc(`users/${uid}/saves/${g.id}`).get();
   if(s.exists)data=s.data().data||{};
  }
 }catch(e){
  console.warn('Spielstand konnte nicht geladen werden:',e);
 }

 if(!$('#fr')||cur!==g.id)return;

 frame.srcdoc=bridgeGame(g.html||'',data);

 $('#saveInfo').textContent=
  'Spielstand wird automatisch gespeichert, wenn das Spiel localStorage verwendet.';

 loadVoteInfo(g.id);
}

window.addEventListener('message',e=>{
 let f=$('#fr');

 if(!f||e.source!==f.contentWindow||e.data?.type!=='BW_SAVE'||!uid||!cur)return;

 clearTimeout(saveTimer);

 let data=e.data.data||{};

 saveTimer=setTimeout(()=>{
  db.doc(`users/${uid}/saves/${cur}`).set({
   data,
   updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
   if($('#saveInfo'))$('#saveInfo').textContent='Spielstand automatisch gespeichert ✓';
  }).catch(err=>{
   if($('#saveInfo'))$('#saveInfo').textContent='Speicherfehler: '+err.message;
  });
 },600);
});

/* BEWERTUNGEN */
async function loadVoteInfo(id){
 try{
  let s=await db.collection(`games/${id}/votes`).get();
  let v=s.docs.map(d=>d.data().value).filter(n=>n>=1&&n<=5);
  let avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'–';

  if($('#voteInfo'))$('#voteInfo').textContent=`${avg}/5 · ${v.length} Bewertungen`;

  if(uid){
   let mine=await db.doc(`games/${id}/votes/${uid}`).get();
   if(mine.exists&&$('#vote'))$('#vote').value=mine.data().value;
  }
 }catch(e){
  if($('#voteInfo'))$('#voteInfo').textContent='Bewertungen nicht verfügbar';
 }
}

async function sendVote(){
 let n=Number($('#vote').value);

 if(!uid||!cur||n<1||n>5){
  alert('Wähle zuerst 1 bis 5 Sterne.');
  return;
 }

 try{
  await db.doc(`games/${cur}/votes/${uid}`).set({value:n});
  loadVoteInfo(cur);
 }catch(e){
  alert('Bewertung fehlgeschlagen: '+e.message);
 }
}

/* SPIELE ÖFFNEN */
async function play(id){
 let g=games.find(x=>String(x.id)===String(id));
 if(!g)return;

 cur=g.id;
 view='play';
 render();

 if(uid){
  db.collection('games').doc(g.id).update({
   plays:firebase.firestore.FieldValue.increment(1)
  }).catch(e=>console.warn('Aufrufzähler:',e));
 }
}

/* FIREBASE START */
function init(){
 // Die Startseite wird sofort angezeigt.
 render();

 // Spiele werden unabhängig von der Anmeldung geladen.
 db.collection('games').onSnapshot(s=>{
  games=s.docs.map(d=>({id:d.id,...d.data()}))
   .sort((a,b)=>(b.created||0)-(a.created||0));

  firebaseState='Spiele live aktualisiert';

  if(view==='home'||view==='admin')render();
 },e=>{
  firebaseState='Firebase-Lesefehler: '+e.message;
  if(view==='home')render();
  console.error(e);
 });

 // Anonyme Anmeldung läuft im Hintergrund.
 auth.signInAnonymously().then(async c=>{
  uid=c.user.uid;
  firebaseState='Mit Firebase verbunden';

  db.doc(`users/${uid}`).get().then(s=>{
   if(s.exists){
    av={...av,...s.data()};
    if(view!=='play')render();
   }
  }).catch(()=>{});

  startPresence();

  if(view==='home')render();
 }).catch(e=>{
  firebaseState='Anonyme Anmeldung nicht verfügbar: '+e.message;
  if(view==='home')render();
  console.error(e);
 });
}

init();
</script>
