async function publishPresence(){
 if(!db||!uid)return;
 try{await db.doc(`presence/${uid}`).set({lastSeen:Date.now()},{merge:true});}catch(e){console.warn('Online-Status konnte nicht aktualisiert werden:',e.message);}
}
function startPresence(){
 if(!db||!uid)return;
 publishPresence();
 if(presenceTimer)clearInterval(presenceTimer);
 presenceTimer=setInterval(publishPresence,45000);
 window.addEventListener('pagehide',()=>{try{db.doc(`presence/${uid}`).set({lastSeen:0},{merge:true});}catch(e){} });
}
function stopOnlineWatch(){if(presenceUnsub){presenceUnsub();presenceUnsub=null;}}

 if(!adminUnlocked||!isAdminUser()||!db)return;

 const target=$('#onlinePlayers');if(target)target.textContent='Lade Online-Spieler…';
 presenceUnsub=db.collection('presence').onSnapshot(async snap=>{
  try{
   const cutoff=Date.now()-120000;
   const active=snap.docs.filter(d=>Number(d.data().lastSeen||0)>cutoff);
   const users=await db.collection('users').get();
   const names=new Map(users.docs.map(d=>[d.id,(d.data()||{}).name||'Spieler']));
   onlineCache=active.map(d=>({uid:d.id,name:names.get(d.id)||'Spieler'}));

   const count=$('#onlineCount');if(count)count.textContent=String(onlineCache.length);

 },e=>{const el=$('#onlinePlayers');if(el)el.textContent='Keine Berechtigung für die Online-Liste. Firestore-Regeln prüfen.';});
}

function drawUp(){const keep=['t','d','i','c'].map(k=>$('#'+k)?.value);
 $('#app').innerHTML=`<div class="panel"><h2 style="margin-top:0">🎮 Spiel erstellen</h2><div class="row"><div><label>Titel</label><input id="t" maxlength="40"><label>Beschreibung</label><input id="d" maxlength="120"></div><div><label>Icon (Emoji)</label><input id="i" value="🎮" maxlength="4"><label>Kategorie</label><select id="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
 <label>Dateien &amp; Skripte (.html .js .css .json .png .jpg .svg .mp3 …)</label>
 <div class="drop" id="dz" onclick="$('#fi').click()"><div style="font-size:34px">📁</div>Dateien hierher ziehen oder klicken<input type="file" id="fi" multiple hidden onchange="addF(this.files)"></div>
 ${files.map((f,i)=>`<div class="file">${f.t=='text'?'📄':'🖼️'}<b>${esc(f.name)}</b><small>${(f.size/1024).toFixed(1)} KB</small><button onclick="files.splice(${i},1);drawUp()">✕</button></div>`).join('')}
 <details style="margin:10px 0"><summary class="mu" style="cursor:pointer">➕ Skript direkt schreiben / einfügen</summary><input id="sn" placeholder="Dateiname z. B. game.js"><textarea id="sc" placeholder="Code hier einfügen…"></textarea><button class="sec" onclick="addS()">Skript hinzufügen</button></details>
 <label>Vorschaubild (optional)</label><input type="file" accept="image/*" onchange="setTh(this.files[0])">${thumb?`<div class="th" style="height:80px;width:140px;border-radius:12px;background:url(${thumb}) center/cover;margin-bottom:10px"></div>`:''}
 <button class="sec" onclick="prev()">👁 Vorschau</button> <button class="btn" onclick="upl()" ${window.bwUploading?"disabled":""}>🧪 Testen &amp; veröffentlichen</button> <span id="ok" class="${msg.startsWith('✓')?'ok':'err'}">${esc(msg)}</span>
 <p class="mu">Hauptdatei ist die <b>index.html</b> (oder die erste HTML-Datei). Verweise auf deine .js-, .css- und Bilddateien werden automatisch eingebunden. Ohne HTML-Datei erzeuge ich eine Seite aus deinen Skripten. Max. ca. 250 KB gesamt.</p><div id="pv"></div></div>`;
 [['t',0],['d',1],['i',2],['c',3]].forEach(([k,n])=>{if(keep[n]!=null)$('#'+k).value=keep[n]});
 const dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('h')};dz.ondragleave=()=>dz.classList.remove('h');dz.ondrop=e=>{e.preventDefault();addF(e.dataTransfer.files)}}
const rd=(f,u)=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);u?x.readAsDataURL(f):x.readAsText(f)});
async function addF(fl){for(const f of fl){const tx=/\.(html?|js|css|json|txt|svg|xml)$/i.test(f.name);files=files.filter(x=>x.name!=f.name);files.push({name:f.name,size:f.size,t:tx?'text':'bin',data:await rd(f,!tx)})}drawUp()}
function addS(){const n=$('#sn').value.trim(),c=$('#sc').value;if(!n||!c)return;files=files.filter(x=>x.name!=n);files.push({name:n,size:c.length,t:'text',data:c});drawUp()}
async function setTh(f){if(!f)return;const u=await rd(f,1);const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=320;c.height=180;c.getContext('2d').drawImage(im,0,0,320,180);thumb=c.toDataURL('image/jpeg',.7);drawUp()};im.src=u}
function bundle(){
 const norm=p=>{try{p=decodeURIComponent(p)}catch(e){}return String(p||'').split(/[?#]/)[0].replace(/\\/g,'/').replace(/^\.?\//,'').replace(/^\/+/,'')};
 const findFile=ref=>{
  const key=norm(ref);if(!key||/^(https?:|data:|blob:|javascript:|\/\/)/i.test(key))return null;
  let f=files.find(x=>norm(x.name)===key);
  if(f)return f;
  const base=key.split('/').pop(),matches=files.filter(x=>norm(x.name).split('/').pop()===base);
  return matches.length===1?matches[0]:null;
 };
 const used=new Set(),scriptSafe=x=>String(x).replace(/<\/script/gi,'<\\/script');
 const asUri=f=>f.t==='bin'?f.data:'data:text/plain;charset=utf-8,'+encodeURIComponent(f.data);
 const rewriteCss=css=>String(css).replace(/url\(\s*(['"]?)(?!data:|https?:|\/\/|#)([^)'"]+)\1\s*\)/gi,(m,q,path)=>{
  const f=findFile(path);if(!f)return m;used.add(f.name);return 'url("'+asUri(f)+'")';
 });
 const rewriteAttrs=html=>String(html).replace(/\b(src|href|poster)=("([^"]*)"|'([^']*)')/gi,(m,attr,quoted,dq,sq)=>{
  const value=dq??sq;
  if(!value||/^(https?:|data:|blob:|javascript:|\/\/|#|mailto:)/i.test(value))return m;
  const f=findFile(value);if(!f)return m;
  used.add(f.name);
  if(/\.css(?:[?#].*)?$/i.test(value)&&attr.toLowerCase()==='href'&&f.t==='text')return '<style>'+rewriteCss(f.data)+'</style>';
  if(/\.js(?:[?#].*)?$/i.test(value)&&attr.toLowerCase()==='src'&&f.t==='text')return '<script>'+scriptSafe(f.data)+'<\\/script>';
  return attr+'="'+asUri(f)+'"';
 });
 let htmlFile=files.find(f=>/^index\.html?$/i.test(f.name))||files.find(f=>/\.html?$/i.test(f.name));
 let out='';
 if(htmlFile){
  used.add(htmlFile.name);out=htmlFile.data;
  out=out.replace(/<script\b([^>]*?)\bsrc=(["'])([^"']+)\2([^>]*)>\s*<\/script>/gi,(m,before,q,src,after)=>{
   const f=findFile(src);if(!f||f.t!=='text'||! /\.m?js(?:[?#].*)?$/i.test(src))return m;
   used.add(f.name);
   if(/\btype\s*=\s*["']module["']/i.test(before+' '+after))return m;
   return '<script'+before+after+'>'+scriptSafe(f.data)+'<\\/script>';
  });
  out=out.replace(/<link\b([^>]*?)\bhref=(["'])([^"']+\.css(?:[?#][^"']*)?)\2([^>]*)>/gi,(m,b,q,href,a)=>{
   const f=findFile(href);if(!f||f.t!=='text')return m;
   used.add(f.name);return '<style>'+rewriteCss(f.data)+'</style>';
  });
  out=rewriteAttrs(out);
 }else{
  const css=files.filter(f=>/\.css$/i.test(f.name)&&f.t==='text');
  const js=files.filter(f=>/\.js$/i.test(f.name)&&f.t==='text');
  css.concat(js).forEach(f=>used.add(f.name));
  out='<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:system-ui,sans-serif}canvas{display:block;max-width:100%}'+css.map(f=>rewriteCss(f.data)).join('\n')+'</style></head><body><canvas id="game" style="display:block;width:100%;height:100vh"></canvas>'+js.map(f=>'<script>'+scriptSafe(f.data)+'<\\/script>').join('')+'</body></html>';
 }
 // Nur echte HTML-/CSS-Dateiverweise ersetzen; niemals Dateinamen pauschal im JavaScript-Text austauschen.
 out=out.replace(/url\(\s*(['"]?)(?!data:|https?:|\/\/|#)([^)'"]+)\1\s*\)/gi,(m,q,path)=>{
  const f=findFile(path);if(!f)return m;used.add(f.name);return 'url("'+asUri(f)+'")';
 });
 return out;
}
function prev(){if(!files.length){msg='Füge erst Dateien oder Skripte hinzu';return drawUp()}$('#pv').innerHTML='<br><iframe sandbox="allow-scripts" id="pf"></iframe>';$('#pf').srcdoc=bundle()}
async function saveAv(){try{if(!uid)throw new Error('Noch nicht mit Firebase verbunden');await db.doc(`users/${uid}`).set(av,{merge:true});$('#ok').textContent='Gespeichert ✓'}catch(e){$('#ok').textContent='Fehler: '+e.message}}
let saveTimer=null;
function gameBridge(html,initialData={}){
 const initial=JSON.stringify(initialData).replace(/</g,'\\u003c');
 const bridge=`<script>(function(){const data=${initial};let ready=true;const store={get length(){return Object.keys(data).length},key(i){return Object.keys(data)[i]??null},getItem(k){k=String(k);return Object.prototype.hasOwnProperty.call(data,k)?String(data[k]):null},setItem(k,v){data[String(k)]=String(v);send()},removeItem(k){delete data[String(k)];send()},clear(){Object.keys(data).forEach(k=>delete data[k]);send()}};let timer=null;function send(){clearTimeout(timer);timer=setTimeout(()=>{try{parent.postMessage({type:'BW_SAVE',data:{...data}},'*')}catch(e){}},150)};try{Object.defineProperty(window,'localStorage',{configurable:true,value:store});}catch(e){window.localStorage=store;}window.BlockWeltSave={save:(k,v)=>store.setItem(k,typeof v==='string'?v:JSON.stringify(v)),load:(k,fallback)=>{const v=store.getItem(k);if(v===null)return fallback;try{return JSON.parse(v)}catch(e){return v}},ready:fn=>fn()};parent.postMessage({type:'BW_READY'},'*');})();<\/script>`;
 return /<\/head>/i.test(html)?html.replace(/<\/head>/i,bridge+'</head>'):bridge+html;
}
async function startGame(g){
 const frame=$('#fr');let initial={};
 if(!frame||!g||!g.html){const info=$('#saveInfo');if(info)info.textContent='Dieses Spiel hat keinen gültigen HTML-Inhalt.';return;}
 try{if(uid&&db){const snap=await db.doc(`users/${uid}/saves/${g.id}`).get();if(snap.exists)initial=snap.data().data||{};}}catch(e){console.warn('Spielstand konnte nicht geladen werden; das Spiel startet trotzdem:',e);}
 if(!$('#fr')||cur!==g.id)return;
 frame.srcdoc=gameBridge(g.html,initial);
 const el=$('#saveInfo');if(el)el.textContent=Object.keys(initial).length?'Letzter Spielstand geladen. Neue Fortschritte werden automatisch gespeichert.':'Spiel gestartet. Neue Fortschritte werden automatisch gespeichert, sofern das Spiel localStorage verwendet.';
 loadVoteInfo(g.id);
}
window.addEventListener('message',e=>{
 const frame=$('#fr');if(!frame||e.source!==frame.contentWindow||!e.data)return;
 if(e.data.type==='BW_SAVE'&&uid&&cur){clearTimeout(saveTimer);const data=e.data.data||{};saveTimer=setTimeout(async()=>{try{const json=JSON.stringify(data);if(json.length>700000)throw new Error('Spielstand ist zu groß (max. ca. 700 KB)');await db.doc(`users/${uid}/saves/${cur}`).set({data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});const el=$('#saveInfo');if(el)el.textContent='Spielstand automatisch gespeichert ✓';}catch(err){console.error('Spielstand speichern:',err);const el=$('#saveInfo');if(el)el.textContent='Speicherfehler: '+err.message;}},700);}
});
async function loadVoteInfo(id){try{const s=await db.collection(`games/${id}/votes`).get();const vals=s.docs.map(d=>d.data().value).filter(n=>Number.isInteger(n)&&n>=1&&n<=5);const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'–';const el=$('#voteInfo');if(el)el.textContent=`${avg} / 5 · ${vals.length} Bewertungen`;if(uid){const mine=await db.doc(`games/${id}/votes/${uid}`).get();if(mine.exists&&$('#voteSelect'))$('#voteSelect').value=mine.data().value;}}catch(e){const el=$('#voteInfo');if(el)el.textContent='Bewertungen nicht verfügbar';}}
async function sendVote(){const n=Number($('#voteSelect')?.value||0);if(!uid||!cur){alert('Bitte kurz warten, bis Firebase verbunden ist.');return}if(n<1||n>5){alert('Bitte zuerst 1 bis 5 Sterne wählen.');return}try{await db.doc(`games/${cur}/votes/${uid}`).set({uid,value:n,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});loadVoteInfo(cur); }catch(e){alert('Bewertung fehlgeschlagen: '+e.message)}}
async function testUploadedGame(html){
 const frame=document.createElement('iframe');
 frame.setAttribute('sandbox','allow-scripts');
 frame.style.cssText='position:fixed;left:-10000px;top:-10000px;width:800px;height:600px;border:0';
 document.body.appendChild(frame);
 const errors=[];
 const report=`<script>
 window.addEventListener('error',function(e){try{parent.postMessage({type:'BW_TEST_ERROR',message:e.message||'JavaScript-Fehler'},'*')}catch(_){}});
 window.addEventListener('unhandledrejection',function(e){try{parent.postMessage({type:'BW_TEST_ERROR',message:String(e.reason||'Nicht behandelter Promise-Fehler')},'*')}catch(_){}});
 <\\/script>`;
 const source=/<head\\b[^>]*>/i.test(html)?html.replace(/<head\\b[^>]*>/i,m=>m+report):report+html;
 const listener=e=>{if(e.source===frame.contentWindow&&e.data&&e.data.type==='BW_TEST_ERROR')errors.push(String(e.data.message||'Unbekannter Fehler'));};
 window.addEventListener('message',listener);
 try{
  frame.srcdoc=source;
  await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;resolve()};frame.addEventListener('load',finish,{once:true});setTimeout(finish,3000);});
  await new Promise(resolve=>setTimeout(resolve,1200));
 }finally{
  window.removeEventListener('message',listener);
  frame.remove();
 }
 return [...new Set(errors)].slice(0,5);
}
async function upl(){
 if(window.bwUploading)return;
 const t=$('#t').value.trim();
 if(!t||!files.length){msg='Titel und mindestens eine Datei nötig';return drawUp()}
 const html=bundle();
 if(html.length>250000){msg='Zu groß ('+Math.round(html.length/1024)+' KB). Max. 250 KB – Bilder verkleinern.';return drawUp()}
 window.bwUploading=true;msg='🧪 Spiel wird getestet…';drawUp();
 try{
  const errors=await testUploadedGame(html);
  if(errors.length){msg='❌ Test fehlgeschlagen: '+errors.join(' | ');return drawUp()}
  msg='✓ Grundtest bestanden – wird veröffentlicht…';drawUp();
  const g={title:t,desc:$('#d').value.trim(),icon:$('#i').value||'🎮',cat:$('#c').value,html,thumb,author:av.name,ownerUid:uid,created:Date.now(),plays:0};
  if(!uid)throw new Error('Noch nicht mit Firebase verbunden. Bitte Seite neu laden.');
  await db.collection('games').add(g);
  files=[];thumb='';msg='';view='home';render();
 }catch(e){msg='❌ Test oder Upload fehlgeschlagen: '+(e.message||'');drawUp()}
 finally{window.bwUploading=false;}
}
async function countRealPlay(id){
 if(!db||!uid||!id)return;
 try{
  const ref=db.doc(`games/${id}`);
  await db.runTransaction(async tx=>{
   const snap=await tx.get(ref);
   if(!snap.exists)throw new Error('Spiel nicht mehr vorhanden');
   const current=Number(snap.data().plays||0);
   tx.update(ref,{plays:current+1});
  });
 }catch(e){console.warn('Aufruf konnte nicht gespeichert werden:',e);}
}
function play(id){const game=games.find(g=>g.id===id);if(!game||!game.html){alert('Dieses Spiel enthält keine spielbare HTML-Datei.');return;}cur=id;view='play';document.body.classList.add('game-open');render();countRealPlay(id);const shell=$('#gameShell');if(shell){shell.classList.add('game-fullscreen');try{if(shell.requestFullscreen){const p=shell.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}}catch(e){console.info('CSS-Vollbild wird verwendet:',e);}}}
function exitGame(){if(document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(()=>{});}document.body.classList.remove('game-open');const shell=$('#gameShell');if(shell)shell.classList.remove('game-fullscreen');cur=null;view='home';render();}
function go(v){if(v!=='admin')stopOnlineWatch();if(v!=='play'){document.body.classList.remove('game-open');if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});}view=v;render()}
function unlockAdmin(){const error=$('#adminError');if(!isAdminUser()){if(error)error.textContent='Dieses Konto ist nicht als Administrator eingetragen. Melde dich mit einem der freigeschalteten Admin-Konten an.';return;}const v=$('#adminPass')?.value||'';if(v===ADMIN_PASSWORD){adminUnlocked=true;sessionStorage.setItem('bw_admin_ok','1');render()}else{if(error)error.textContent='Falsches Passwort.';}}
function lockAdmin(){adminUnlocked=false;sessionStorage.removeItem('bw_admin_ok');stopOnlineWatch();view='home';render()}
async function loadAdminPlayers(){if(!adminUnlocked||!isAdminUser())return;const el=$('#adminPlayers');if(!el)return;el.textContent='Lade Spieler…';try{const snap=await db.collection('users').get();if(!snap.size){el.textContent='Noch keine Spieler gefunden.';return;}el.innerHTML=snap.docs.map(doc=>{const d=doc.data()||{},name=esc(d.name||'Unbenannt'),banned=!!d.banned,until=Number(d.banUntil||0);const status=banned?(!until?'Dauerhaft gesperrt':until>Date.now()?'Gesperrt bis '+new Date(until).toLocaleString('de-DE'):'Sperre abgelaufen'):'Aktiv';return `<div class="admin-user"><div class="details"><b>${name}</b><br><small class="mu">${esc(doc.id)}</small><br><small class="${banned?'err':'ok'}">${status}</small></div><div class="actions"><select id="ban-${doc.id}" style="width:125px;margin:0"><option value="3600000">1 Stunde</option><option value="86400000">24 Stunden</option><option value="604800000">7 Tage</option><option value="2592000000">30 Tage</option><option value="0">Dauerhaft</option></select><button class="sec danger" onclick="banUser('${doc.id}')">Sperren</button>${banned?`<button class="sec" onclick="unbanUser('${doc.id}')">Entsperren</button>`:''}</div></div>`}).join('');}catch(e){el.textContent='Fehler beim Laden: '+e.message;}}
async function banUser(id){if(!adminUnlocked||!isAdminUser())return;const duration=Number($('#ban-'+id)?.value||0);const reason=prompt('Sperrgrund (optional):','Regelverstoß')||'';try{await db.doc(`users/${id}`).set({banned:true,banUntil:duration?Date.now()+duration:0,banReason:reason},{merge:true});loadAdminPlayers();}catch(e){alert('Sperren fehlgeschlagen: '+e.message)}}
async function unbanUser(id){if(!adminUnlocked||!isAdminUser())return;try{await db.doc(`users/${id}`).set({banned:false,banUntil:0,banReason:''},{merge:true});loadAdminPlayers();}catch(e){alert('Entsperren fehlgeschlagen: '+e.message)}}
async function kickAllPlayers(){if(!adminUnlocked||!isAdminUser()||!confirm('Wirklich alle Spieler aus ihren Spielen werfen?'))return;try{const ref=db.doc('system/control');const snap=await ref.get();const v=(snap.exists?snap.data().kickVersion||0:0)+1;await ref.set({kickVersion:v,kickAt:Date.now()},{merge:true});alert('Befehl wurde gesendet.');}catch(e){alert('Fehler: '+e.message)}}
async function deleteGame(id){if(!adminUnlocked||!isAdminUser()||!confirm('Dieses Spiel wirklich löschen?'))return;try{await db.doc(`games/${id}`).delete();alert('Spiel gelöscht.');render();}catch(e){alert('Löschen fehlgeschlagen: '+e.message)}}
init();
</script></body></html>
